# Full local stack — from repo root:
#   docker compose up -d --build
#   docker compose down
#
# Individual services (examples):
#   docker compose up -d auth_app auth_db auth_redis
#   docker compose up -d frontend frontend_nginx
#
# Migrations / seeders (containers must already be up):
#   ./scripts/demo-prep.sh
#
# All microservice tests (containers must already be up):
#   ./scripts/test-all.sh

include:
  - path: infra/compose.yml
  - path: auth_service/compose.yml
  - path: catalog_service/compose.yml
  - path: notification_service/compose.yml
  - path: order_service/compose.yml
  - path: search_service/compose.yml
  - path: analytic_service/compose.yml
  - path: frontend/compose.yml
