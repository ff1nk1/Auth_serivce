services:

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: laravel_app
    restart: unless-stopped

    # Больше не нужен для доступа через Nginx
    # ports:
    #   - "8000:8000"

    volumes:
      - ./backend:/var/www

    env_file:
      - ./backend/.env

    environment:
      # Потом перенести в env
      REDIS_HOST: redis
      REDIS_PORT: 6380
      REDIS_DB: 0
      REDIS_CACHE_DB: 1
      DB_HOST: db
      DB_PORT: 5432

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - app_network


  db:
    image: postgres:16-alpine

    container_name: laravel_db
    restart: unless-stopped

    ports:
      - "5433:5432"

    env_file:
      - ./backend/.env

    volumes:
      - pgdata:/var/lib/postgresql/data

    networks:
      - app_network


  redis:
    image: redis:7-alpine

    container_name: laravel_redis
    restart: unless-stopped

    ports:
      - "6380:6379"

    volumes:
      - redisdata:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    networks:
      - app_network


  mailhog:
    image: mailhog/mailhog

    ports:
      - "1025:1025"
      - "8025:8025"

    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: react_frontend
    restart: unless-stopped

    volumes:
      - ./frontend:/app
      - /app/node_modules

    expose:
      - "5173"

    networks:
      - app_network

    depends_on:
      - app


  nginx:
    image: nginx:alpine

    ports:
      - "80:80"
      - "443:443"


    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

    depends_on:
      - app



    networks:
      - app_network


volumes:
  pgdata:
  redisdata:


networks:
  app_network: