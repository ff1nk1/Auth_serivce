services:
  auth_app:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        "php-project-php-base:8.5": "service:php-base"
    image: auth_service:local
    pull_policy: never
    container_name: auth_service_app
    restart: unless-stopped
    # Not exposed via Traefik or host — only Docker network (frontend nginx / admin)
    expose:
      - "8001"
    volumes:
      - .:/var/www
    env_file:
      - .env
    environment:
      # Unique hostnames on shared php_project_net
      DB_HOST: auth_service_db
      DB_PORT: 5432
      REDIS_HOST: auth_service_redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      CATALOG_SERVICE_URL: http://catalog_service_app:8002
      NOTIFICATION_SERVICE_URL: http://notification_service_app:8003
      ORDER_SERVICE_URL: http://order_service_app:8004
      SESSION_DOMAIN: null
      JWT_COOKIE_DOMAIN: ""
      APP_URL: http://auth_service_app:8001
    depends_on:
      auth_db:
        condition: service_started
      auth_redis:
        condition: service_healthy
    networks:
      - php_project_net

  auth_db:
    image: postgres:16-alpine
    container_name: auth_service_db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    networks:
      - php_project_net

  auth_redis:
    image: redis:7-alpine
    container_name: auth_service_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - auth_redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - php_project_net

volumes:
  auth_pgdata:
  auth_redisdata:
