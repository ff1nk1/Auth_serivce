services:
  php-base:
    build:
      context: ../infra/php-base
      dockerfile: Dockerfile
    image: php-project-php-base:8.5
    entrypoint: ["true"]
    restart: "no"
    network_mode: none

  app:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        "php-project-php-base:8.5": "service:php-base"
    image: admin_frontend:local
    pull_policy: never
    container_name: admin_frontend
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - .:/var/www
    env_file:
      - .env
    environment:
      APP_URL: https://app.localhost
      AUTH_API_URL: http://auth_service_app:8001/api
      SESSION_DOMAIN: null
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/database/database.sqlite
    networks:
      - php_project_net
    labels:
      - traefik.enable=true
      - traefik.docker.network=php_project_net
      # Higher priority than frontend catch-all
      - traefik.http.routers.admin.rule=Host(`app.localhost`) && (PathPrefix(`/admin`) || PathPrefix(`/livewire`) || PathPrefix(`/css/filament`) || PathPrefix(`/js/filament`) || PathPrefix(`/fonts/filament`))
      - traefik.http.routers.admin.entrypoints=web
      - traefik.http.routers.admin.priority=100
      - traefik.http.services.admin.loadbalancer.server.port=8000

networks:
  php_project_net:
    external: true
    name: php_project_net
