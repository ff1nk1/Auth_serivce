services:
  catalog_app:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        "php-project-php-base:8.5": "service:php-base"
    image: catalog_service:local
    pull_policy: never
    container_name: catalog_service_app
    restart: unless-stopped
    # Internal only — reached via auth_service gateway
    expose:
      - "8002"
    volumes:
      - .:/var/www
    env_file:
      - .env
    environment:
      # Unique hostnames on shared php_project_net
      DB_HOST: catalog_service_db
      DB_PORT: 5432
      REDIS_HOST: catalog_service_redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      AWS_ENDPOINT: http://catalog-minio:9000
    depends_on:
      catalog_db:
        condition: service_started
      catalog_redis:
        condition: service_healthy
      catalog_minio:
        condition: service_started
    networks:
      - php_project_net

  catalog_db:
    image: postgres:16-alpine
    container_name: catalog_service_db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    volumes:
      - catalog_pgdata:/var/lib/postgresql/data
    networks:
      - php_project_net

  catalog_redis:
    image: redis:7-alpine
    container_name: catalog_service_redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - catalog_redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - php_project_net

  catalog_minio:
    image: cr.yandex/mirror/minio/minio:latest
    container_name: catalog_service_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "8999:8999"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - catalog_minio_data:/data
    command: server /data --console-address ":8999"
    networks:
      php_project_net:
        aliases:
          # mc rejects hostnames with underscores
          - catalog-minio

  catalog_minio_init:
    image: cr.yandex/mirror/minio/mc:latest
    container_name: catalog_service_minio_init
    depends_on:
      - catalog_minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until mc alias set local http://catalog-minio:9000 minioadmin minioadminpassword; do
          echo "waiting for minio..."
          sleep 1
        done
        mc mb -p local/media || true
        mc anonymous set download local/media
        echo "minio bucket media ready"
    networks:
      - php_project_net
    restart: "no"

  catalog_kafka_order_consumer:
    image: catalog_service:local
    pull_policy: never
    container_name: catalog_kafka_order_consumer
    restart: unless-stopped
    command: php artisan kafka:consume:order-events
    volumes:
      - .:/var/www
    env_file:
      - .env
    environment:
      DB_HOST: catalog_service_db
      DB_PORT: 5432
      REDIS_HOST: catalog_service_redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
    depends_on:
      - catalog_app
      - catalog_db
      - catalog_redis
    networks:
      - php_project_net

  catalog_kafka_outbox_worker:
    image: catalog_service:local
    pull_policy: never
    container_name: catalog_kafka_outbox_worker
    restart: unless-stopped
    command: php artisan kafka:outbox:work
    volumes:
      - .:/var/www
    env_file:
      - .env
    environment:
      DB_HOST: catalog_service_db
      DB_PORT: 5432
      REDIS_HOST: catalog_service_redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
    depends_on:
      - catalog_app
      - catalog_db
    networks:
      - php_project_net

volumes:
  catalog_pgdata:
  catalog_redisdata:
  catalog_minio_data:
