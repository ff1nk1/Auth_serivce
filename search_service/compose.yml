services:
  search_app:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        "php-project-php-base:8.5": "service:php-base"
    image: search_service:local
    pull_policy: never
    container_name: search_service_app
    restart: unless-stopped
    # Internal only — reached via auth_service gateway (when wired)
    expose:
      - "8005"
    volumes:
      - .:/var/www
    env_file:
      - .env
    environment:
      KAFKA_BROKERS: kafka:29092
      OPENSEARCH_HOSTS: http://search_opensearch:9200
      KAFKA_CACHE_DRIVER: array
      APP_URL: http://search_service_app:8005
    depends_on:
      search_opensearch:
        condition: service_healthy
    networks:
      - php_project_net

  search_opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: search_service_opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - search_osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - php_project_net

  search_opensearch_dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1
    container_name: search_service_opensearch_dashboards
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://search_opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      search_opensearch:
        condition: service_healthy
    networks:
      - php_project_net

  search_kafka_product_consumer:
    image: search_service:local
    pull_policy: never
    container_name: search_kafka_product_consumer
    restart: unless-stopped
    command: php artisan kafka:consume:product-events
    volumes:
      - .:/var/www
    env_file:
      - .env
    environment:
      KAFKA_BROKERS: kafka:29092
      OPENSEARCH_HOSTS: http://search_opensearch:9200
      KAFKA_CACHE_DRIVER: array
    depends_on:
      search_app:
        condition: service_started
      search_opensearch:
        condition: service_healthy
    networks:
      - php_project_net

  search_kafka_category_consumer:
    image: search_service:local
    pull_policy: never
    container_name: search_kafka_category_consumer
    restart: unless-stopped
    command: php artisan kafka:consume:category-events
    volumes:
      - .:/var/www
    env_file:
      - .env
    environment:
      KAFKA_BROKERS: kafka:29092
      OPENSEARCH_HOSTS: http://search_opensearch:9200
      KAFKA_CACHE_DRIVER: array
    depends_on:
      search_app:
        condition: service_started
      search_opensearch:
        condition: service_healthy
    networks:
      - php_project_net

  search_kafka_stock_consumer:
    image: search_service:local
    pull_policy: never
    container_name: search_kafka_stock_consumer
    restart: unless-stopped
    command: php artisan kafka:consume:stock-events
    volumes:
      - .:/var/www
    env_file:
      - .env
    environment:
      KAFKA_BROKERS: kafka:29092
      OPENSEARCH_HOSTS: http://search_opensearch:9200
      KAFKA_CACHE_DRIVER: array
    depends_on:
      search_app:
        condition: service_started
      search_opensearch:
        condition: service_healthy
    networks:
      - php_project_net

volumes:
  search_osdata:
